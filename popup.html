<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromiseLock</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { width: 280px; margin: 0; padding: 20px; background: #11130f; color: #f5f4e9; }
      h1 { margin: 0 0 8px; font-size: 21px; letter-spacing: .02em; }
      p { color: #b9c1ae; line-height: 1.45; font-size: 13px; }
      button { width: 100%; border: 0; border-radius: 10px; padding: 12px 14px; background: #d8f36a; color: #10140b; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 20px; margin-top: 12px; font-size: 12px; color: #d8f36a; }
    </style>
  </head>
  <body>
    <h1>PromiseLock</h1>
    <p>Catch “attached”, “here’s the link”, and unfinished placeholders before they leave this tab.</p>
    <button id="enable" type="button">Enable on this tab</button>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
